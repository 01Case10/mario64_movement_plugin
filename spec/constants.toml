# Every constant that shapes behavior, each with a provenance entry.
# A build step (tools/check-provenance.py, run in CI) refuses to compile a
# constant that has no entry here, so nothing enters the code from memory.
#
# Confidence levels: low = working assumption marked (verify) in specs;
# medium = one independent source; high = two sources agree or a golden
# scenario passes at tiers A and B.

