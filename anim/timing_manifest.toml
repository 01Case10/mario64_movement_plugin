# StepKit animation timing manifest (phase 6).
# Original timing authored for the stepkit reference mannequin; not derived
# from any commercial game. 30 fps gameplay clock.
# See crates/stepkit-anim/src/manifest.rs for the schema.

fps = 30

[tolerances]
